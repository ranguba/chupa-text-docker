name: Build
on:
  - push
  - pull_request
concurrency:
  group: ${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true
env:
  NEED_PUSH: ${{ github.event_name == 'push' && github.repository == 'ranguba/chupa-text-docker' }}
jobs:
  chupa-text:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        id:
          - "debian"
          - "ubuntu"
    env:
      TAGS: ghcr.io/${{ github.repository }}:${{ matrix.id }}-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ranguba/chupa-text
          path: chupa-text-source
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
        id: buildx
      - uses: docker/build-push-action@v7
        with:
          context: chupa-text/${{ matrix.id }}
          load: true
          tags: ${{ env.TAGS }}
      - name: Test
        run: |
          docker container run \
            --detach \
            --rm \
            --name chupa-text \
            --publish 127.0.0.1:20080:3000 \
            ${TAGS}
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 10 \
            --retry-delay 10 \
            --retry-all-errors \
            --form "data=@chupa-text-source/test/fixture/docx/one-page.docx;type=application/vnd.openxmlformats-officedocument.wordprocessingml.document" \
            http://127.0.0.1:20080/extraction.json | \
            tee response.json
          jq --exit-status '[.texts[].body] == ["Page1"]' response.json
      - name: Show logs
        if: failure()
        run: |
          docker container logs chupa-text || :
      - name: Clean up
        if: always()
        run: |
          docker container rm -f chupa-text || :
      - uses: docker/build-push-action@v7
        id: docker_build
        with:
          context: chupa-text/${{ matrix.id }}
          push: ${{ env.NEED_PUSH }}
          tags: ${{ env.TAGS }}
      - name: Image info
        run: |
          echo "ref: ${{ github.ref }}"
          echo "tags: ${{ env.TAGS }}"
          echo "digest: ${{ steps.docker_build.outputs.digest }}"
  proxy:
    name: proxy
    runs-on: ubuntu-latest
    env:
      TAGS: ghcr.io/${{ github.repository }}:proxy
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
        id: buildx
      - uses: docker/build-push-action@v7
        with:
          context: proxy
          load: true
          tags: ${{ env.TAGS }}
      - name: Test
        run: |
          docker container run \
            --detach \
            --rm \
            --name proxy \
            --publish 127.0.0.1:3128:3128 \
            ${TAGS}
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 15 \
            --retry-delay 2 \
            --retry-all-errors \
            --proxy http://127.0.0.1:3128/ \
            https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.gitignore | \
            tee response.txt
          diff -u .gitignore response.txt
      - name: Show logs
        if: failure()
        run: |
          docker container logs proxy || :
      - name: Clean up
        if: always()
        run: |
          docker container rm -f proxy || :
      - uses: docker/build-push-action@v7
        id: docker_build
        with:
          context: proxy
          push: ${{ env.NEED_PUSH }}
          tags: ${{ env.TAGS }}
      - name: Image info
        run: |
          echo "ref: ${{ github.ref }}"
          echo "tags: ${{ env.TAGS }}"
          echo "digest: ${{ steps.docker_build.outputs.digest }}"
